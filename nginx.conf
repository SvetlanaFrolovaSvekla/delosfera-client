# Отдача собранного приложения.
#
# Раньше здесь работал `vite preview` — инструмент, которым разработчик
# проверяет сборку у себя. Он ставит на каждый файл Cache-Control: no-cache,
# поэтому браузер при каждом переходе между разделами шёл на сервер
# переспрашивать, не изменился ли чанк. Ответ всегда 304 и ноль байт тела,
# но обращение по сети остаётся — и на канале филиала это заметная пауза
# там, где данных вообще не нужно.

server {
    # Порт тот же, что слушал preview: внешний nginx проксирует сюда,
    # и менять его конфигурацию не требуется.
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Имя файла сборки содержит хеш содержимого — index-X-9Z_iZm.js станет
    # другим файлом при любом изменении кода. Значит этот можно держать в
    # кеше сколько угодно: переход в раздел берёт чанк из браузера, не из сети.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Оболочка приложения хеша в имени не имеет и перечисляет актуальные чанки.
    # Её надо перепроверять всегда: иначе после выкладки браузер держит старый
    # index.html и просит чанки, которых на сервере уже нет — приложение
    # встречает человека белым экраном.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Маршруты приложения живут на клиенте: /sz/14 на сервере не существует,
    # но должен открыть приложение, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
